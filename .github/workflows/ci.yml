name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.app

      - name: Unit tests (SPM, headless)
        working-directory: Packages
        run: swift test

      - name: Build app (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SuperTV.xcodeproj \
            -scheme SuperTV \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify
